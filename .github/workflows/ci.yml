name: Clean UFO-First CI
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  offline-contract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install API test dependencies
        run: python -m pip install -r requirements-app.txt httpx
      - name: Repository structure and hygiene
        run: python -m unittest discover -s tests -v
